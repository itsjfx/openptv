# Project-wide Gradle properties.

# JVM args for the Gradle daemon. -Xmx2g is enough for a single-module Compose app.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Parallel project execution + build cache.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX.
android.useAndroidX=true

# R8 full mode for release builds.
android.enableR8.fullMode=true

# Non-transitive R class generation (faster builds, prevents accidental cross-module R deps).
android.nonTransitiveRClass=true

# Kotlin code style.
kotlin.code.style=official
