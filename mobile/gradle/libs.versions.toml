[versions]
# Build tooling. Versions are aligned with the canonical
# `android/nav3-recipes` sample at the time of writing so we stay on a
# combination Google has already smoke-tested.
agp = "9.1.1"
kotlin = "2.3.20"
ksp = "2.3.6"

# AndroidX
androidxCoreKtx = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"

# Compose. Note `compose-bom-alpha` because Navigation 3 is still alpha
# and depends on alpha Compose snapshots.
composeBom = "2026.04.00"
material3 = "1.4.0"

# Navigation 3 (alpha — locked surface; expect API churn between phases).
navigation3 = "1.2.0-alpha02"

# DI
hilt = "2.59.2"
hiltNavigationCompose = "1.3.0"

# Serialization
kotlinxSerialization = "1.11.0"

# Time
kotlinxDatetime = "0.6.2"

# Coroutines
kotlinxCoroutines = "1.10.2"

# Persistence
androidxDatastore = "1.1.1"
# Room is the local DB. Pinned to the latest stable 2.7.x line — 2.7 ships the
# KSP2-compatible compiler so KSP `kotlin = "2.3.20"` resolves cleanly. Schema
# export is on (see `:core:database/build.gradle.kts`) so the JSON under
# `core/database/schemas/` is committed and migrations can diff against v1.
androidxRoom = "2.7.2"

# Networking
okhttp = "5.3.2"
retrofit = "3.0.0"

# Maps. MapLibre Android (BSD-2) is the only MapLibre binding available on
# Maven Central — the spec named `org.maplibre.compose:maplibre-compose`
# which doesn't exist as a published artifact today. We pull in the raw SDK
# and wrap it via `AndroidView` inside the `:feature:nearby/OpenPtvMap`
# composable; the wrap is mandatory anyway for the test seam (the Hilt-
# Compose UI test injects a `FakeOpenPtvMap`). License is BSD-2-Clause and
# no GMS deps — verified via `:app:dependencyGuard` baseline diff.
maplibreAndroid = "11.11.0"

# Testing
junit = "4.13.2"
truth = "1.4.4"
turbine = "1.2.1"
# Robolectric — only `:core:database` uses it (so far) to give Room
# in-memory DAO tests a `Context` without an emulator. Pinned to the 4.x line
# that supports AGP 9 + JDK 21. Other modules continue to use plain JUnit;
# this is not the default test runtime.
robolectric = "4.14.1"
androidxTestRunner = "1.7.0"
# AndroidX test core + JUnit4 extension — pulled in by Compose UI tests and by
# `createAndroidComposeRule`. Versions track the AndroidX test BOM line that
# the runner ships against.
androidxTestExt = "1.3.0"
androidxTestCore = "1.7.0"
# Espresso is a transitive dep of the Compose UI test stack (`espresso-core` is
# what `androidx.compose.ui.test.junit4.createAndroidComposeRule` ends up
# pulling). Pinning it explicitly so the version is reproducible.
androidxEspresso = "3.7.0"

# Code quality
# Pinned to the latest 7.x line. Spotless 8.0.0 ships JDK 17 bytecode, which
# breaks the convention plugin compile classpath (`build-logic` targets JVM
# 11 to match the consumed modules). 7.0.4 is still actively maintained and
# uses ktlint internally, so the surface configured under `openptv.spotless`
# stays identical.
spotless = "7.0.4"
# ktlint version Spotless drives. Pinned (vs. Spotless's bundled default) so
# the formatter is reproducible across machines and CI. Matches NIA.
ktlint = "1.4.0"
# detekt 1.23.x is the current stable line. 2.0 is still alpha. The plugin
# (`openptv.detekt`) wires it onto every Kotlin module and the custom rules
# in `:lint:detekt` plug into the same `RuleSetProvider` SPI.
detekt = "1.23.8"
# Dropbox Dependency Guard — locks the transitive dep set on `:app`'s
# `releaseRuntimeClasspath` so accidental Compose-BOM / Retrofit / etc.
# transitive churn fails CI. Only applied on `:app` (the rollup that ends up
# in the APK); debug-only / test configurations are deliberately out of scope.
dependencyGuard = "0.5.0"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }

# Compose (BOM-managed)
androidx-compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

# Navigation 3
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Time
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Persistence
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidxRoom" }
# Room migration test harness. `androidTestImplementation` only — runs on a
# device/emulator because it instantiates a real SQLite database via Room.
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "androidxRoom" }

# Networking
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

# Maps
maplibre-android-sdk = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibreAndroid" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Compose UI test surface — `androidx.compose.ui:ui-test-junit4` provides the
# `createAndroidComposeRule` builder and the assertion DSL; `ui-test-manifest`
# is the empty-manifest helper that lets feature androidTests host a Hilt
# `ComponentActivity` without merging a full Application. Both are pinned by
# the Compose BOM, so the artifact entries here intentionally do not declare a
# version.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Gradle plugins as artifacts — consumed only by the `build-logic` composite
# build so its convention plugins can call into AGP / Kotlin / KSP / Compose /
# Spotless plugin APIs directly. Don't apply these in any module's `plugins {}`
# block — that's what the `openptv.*` convention plugins are for.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
# detekt — Gradle plugin (applied by `openptv.detekt`) plus the `detekt-api`
# surface the custom rules in `:lint:detekt` compile against. `detekt-test`
# is the JUnit harness used by the custom-rule tests.
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# Spotless is applied indirectly through the `openptv.spotless` convention
# plugin. The alias here is so the root build can declare `apply false`,
# which pulls the plugin jar onto the build-script classpath so
# `pluginManager.apply("com.diffplug.spotless")` from the convention plugin
# can resolve the extension classes at runtime.
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# detekt is applied indirectly through the `openptv.detekt` convention plugin.
# Same `apply false` pattern as spotless — pulls the plugin jar onto the
# build-script classpath so the convention plugin can reference its DSL.
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
# Dropbox Dependency Guard — applied directly in `:app/build.gradle.kts`. No
# convention plugin (see `app/build.gradle.kts` rationale): only `:app` rolls
# up the production APK classpath, so this is intentionally one-module-only.
dependency-guard = { id = "com.dropbox.dependency-guard", version.ref = "dependencyGuard" }
