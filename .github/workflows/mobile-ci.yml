name: mobile-ci

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  # Manual trigger so the connected (instrumented) test job can be invoked
  # on-demand from the Actions tab without needing to land a commit. PRs and
  # `master` pushes will skip `connected-test` (`if:` guard below) — that
  # protects the default flow from the ~10 min emulator boot time.
  workflow_dispatch:
    inputs:
      run_connected_tests:
        description: 'Also run :feature:search:connectedDebugAndroidTest on an emulator'
        required: false
        type: boolean
        default: true

# Cancel superseded runs on the same PR so a fast-follow commit doesn't queue.
concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-spotless-detekt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:lintDebug spotlessCheck detekt

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: mobile/**/build/reports/tests/
          retention-days: 3

  dependency-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:dependencyGuard

  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      # Post (or update) a sticky PR comment linking the debug APK artifact so
      # reviewers can grab a build without booting an emulator. The marker
      # comment lets the next CI run rewrite the same comment in place instead
      # of stacking a fresh one per push.
      #
      # The body carries the short commit hash AND a build timestamp (issue
      # #145): GitHub's "edited" indicator on the rewritten comment is hidden
      # on mobile, so without the inline timestamp there's no way to tell
      # whether the linked APK is from the latest push.
      - name: Comment debug APK link on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- debug-apk-link -->'
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          body="${marker}
          **Debug APK:** [app-debug-${SHA}.apk](${ARTIFACT_URL}) (built from \`${SHA:0:7}\` at ${built_at})

          <sub>Requires GitHub login. Artifact expires after 3 days.</sub>"
          existing="$(gh api "repos/${REPO}/issues/${PR}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | head -n1)"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" \
              -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body "$body"
          fi

  # Opt-in: runs the Hilt-instrumented Compose UI tests in :feature:search on
  # a hardware-accelerated AOSP emulator via `reactivecircus/android-emulator-runner`.
  # Gated to `workflow_dispatch` so PR / push runs aren't slowed down by the
  # ~10 min emulator boot; trigger this from the Actions tab when validating
  # a Compose UI change end-to-end. The matrix is intentionally a single
  # API level today (the AOSP target = no GMS, mirroring GrapheneOS); add
  # API 30 / 34 entries here when there's a real coverage reason to.
  connected-test:
    if: github.event_name == 'workflow_dispatch' && inputs.run_connected_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    strategy:
      fail-fast: false
      matrix:
        api-level: [36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # KVM access is what makes `-accel on` work on GitHub-hosted Linux
      # runners; without it the emulator silently falls back to software
      # emulation and tests take 5x longer.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run :feature:search:connectedDebugAndroidTest on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # `default` (not `google_apis*`) so anything that secretly depends on
          # GMS fails here just like it would on GrapheneOS.
          target: default
          arch: x86_64
          working-directory: mobile
          # Headless + accelerated. `script` is the gate the issue calls for.
          script: ./gradlew :feature:search:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: connected-test-reports-${{ matrix.api-level }}
          path: mobile/feature/search/build/reports/androidTests/connected/
          retention-days: 3
