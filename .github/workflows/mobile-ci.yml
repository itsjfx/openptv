name: mobile-ci

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

# Cancel superseded runs on the same PR so a fast-follow commit doesn't queue.
concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-spotless-detekt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:lintDebug spotlessCheck detekt

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: mobile/**/build/reports/tests/

  screenshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Roborazzi screenshot gate (issue #16). `:core:designsystem` owns the
      # baseline today; per-feature smoke suites add themselves to the verify
      # task as they land. Run with --rerun-tasks so Gradle's incremental
      # cache doesn't mask a baseline drift the first time CI sees it.
      - run: ./gradlew :core:designsystem:verifyRoborazziDebug
      # On failure, upload the diff outputs so reviewers can see what changed
      # without re-running the build locally. Roborazzi writes `*_compare.png`
      # (side-by-side expected | actual | diff) and `*_actual.png` to the
      # module's `build/outputs/roborazzi/` directory.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: roborazzi-diff
          path: mobile/core/designsystem/build/outputs/roborazzi/

  dependency-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:dependencyGuard

  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
