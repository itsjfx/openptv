name: mobile-ci

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

# Cancel superseded runs on the same PR so a fast-follow commit doesn't queue.
concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-spotless-detekt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:lintDebug spotlessCheck detekt

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: mobile/**/build/reports/tests/

  screenshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Roborazzi lands in #16. Until it ships, the gate is intentionally a no-op
      # stub — `--dry-run` so the job pattern is real (cache warm, JDK ready) but
      # nothing actually runs. #16 flips this to `verifyRoborazziDebug`.
      - run: ./gradlew --dry-run verifyRoborazziDebug || true

  dependency-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:dependencyGuard

  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
